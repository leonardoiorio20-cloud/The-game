<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Game · Santa Muerte</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0b0610;--panel:#170b1c;--panel2:#24122c;--fg:#f6ecd9;--mut:#b09aa8;--gold:#f0c24b;--rose:#e8385a;--ame:#a46bf0;--fire:#ff8a1f;--ext:#34d399;--jk:#22d3ee;--rg:#5b9bff;--bd:#4b2a55;--disp:"Cinzel Decorative",Georgia,"Times New Roman",serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--fg);font:16px/1.45 Georgia,"Times New Roman",serif;background:radial-gradient(900px 420px at 50% -100px,#51196b 0,transparent 70%),radial-gradient(#ffffff0d 1px,transparent 1px) 0 0/22px 22px,var(--bg)}
#app{max-width:820px;margin:0 auto;padding:10px 14px 30px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font:700 22px var(--disp);color:var(--gold);margin:6px 0;letter-spacing:.5px;text-shadow:0 0 14px #f0c24b55}h1 small{display:block;font-size:12px;color:var(--rose);letter-spacing:3px;text-transform:uppercase}
.bunt{display:flex;justify-content:center;overflow:hidden;border-top:2px solid var(--gold2,#a8801f);margin:2px -14px 12px;height:22px}
.bunt span{flex:none;border-left:13px solid transparent;border-right:13px solid transparent;border-top:20px solid}
.sk{width:1em;height:1em;vertical-align:-.12em;fill:currentColor}
.box{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--gold);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:inset 0 0 0 3px var(--panel),inset 0 0 0 4px var(--bd),0 8px 24px #0009}
input,select,button{font:inherit;border-radius:10px;border:1px solid var(--bd);padding:10px 14px;background:#0f0713;color:var(--fg)}
button{cursor:pointer;background:linear-gradient(180deg,#f04a6c,#b8203f);color:#fff;border-color:var(--gold);font-weight:700;box-shadow:0 3px 10px #0008}
button.sec{background:#150a1a;color:var(--fg);border-color:var(--bd);box-shadow:none}button:disabled{opacity:.35;cursor:default}
label.o{display:inline-flex;gap:6px;align-items:center;padding:7px 12px;border:1px solid var(--bd);border-radius:22px;margin:3px 3px 3px 0;cursor:pointer;font-size:14px;background:#120815}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.lbl{font:700 12px var(--disp);color:var(--gold);letter-spacing:1px;text-transform:uppercase;margin-top:12px}
.pl{display:flex;gap:6px;flex-wrap:wrap}.pl div{padding:5px 12px;border:1px solid var(--bd);border-radius:22px;font-size:14px;background:#120815;opacity:.75}
.pl div.t{opacity:1;border-color:var(--gold);background:#4a1230;box-shadow:0 0 12px #f0c24b66}
.pl small{color:var(--mut)}
.turn{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:13px 14px;border-radius:14px;margin:12px 0;font-weight:700;background:var(--panel2);border:1px solid var(--bd);text-align:center}
.turn.me{background:linear-gradient(90deg,#6b0f2b,#c0264a,#6b0f2b);border-color:var(--gold);color:#fff;font-size:18px;letter-spacing:1px;animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 24px var(--gold)}}
.pips span{display:inline-block;width:13px;height:13px;border-radius:50%;border:2px solid var(--gold);margin:0 2px}.pips .on{background:var(--gold)}
.hint{text-align:center;font-size:13px;color:var(--mut);margin:-4px 0 8px}.hint b{color:var(--rose)}
.piles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px}
.pile{--k:var(--rose);position:relative;min-height:150px;border-radius:14px;border:2px solid var(--k);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:8px 2px;overflow:hidden;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--k) 25%,transparent),transparent 65%),linear-gradient(170deg,#2b1235,#130918);box-shadow:0 0 0 3px #130918,0 0 0 4px color-mix(in srgb,var(--k) 55%,transparent),0 8px 18px #000a}
.pile.d{--k:var(--ame)}.pile.ok{cursor:pointer;border-color:var(--gold);animation:glow 1.2s infinite}.pile.fire{--k:var(--fire);animation:glow 1s infinite}
.pt{font:700 11px var(--disp);color:var(--k);letter-spacing:1px;z-index:1}.pile .n{font-size:44px;font-weight:700;color:var(--fg);text-shadow:0 2px 8px #000;z-index:1;line-height:1}
.wm{position:absolute;left:50%;top:48%;width:72%;transform:translate(-50%,-50%);opacity:.16;color:var(--k);fill:currentColor;pointer-events:none}
.pm{min-height:30px;z-index:1;text-align:center}.pm em{display:block;font:700 10px/1.25 Georgia,serif;font-style:normal;color:var(--ext)}.pm em.mf{color:var(--fire)}.pm em.mj{color:var(--jk)}
.hand{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:20px 0 10px}
.c{--k:var(--gold);width:80px;height:118px;border-radius:12px;position:relative;cursor:pointer;overflow:hidden;border:2px solid var(--k);background:radial-gradient(circle at 50% 46%,color-mix(in srgb,var(--k) 24%,transparent),transparent 65%),linear-gradient(165deg,#2e1537,#150a1a);box-shadow:0 0 0 2px #150a1a,0 0 0 3px color-mix(in srgb,var(--k) 55%,transparent),0 6px 14px #000a;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column;align-items:center;justify-content:center}
.c:hover{transform:translateY(-4px)}.c.sel{transform:translateY(-16px);box-shadow:0 0 0 2px var(--gold),0 0 22px var(--gold)}
.c.t-f{--k:var(--fire)}.c.t-x{--k:var(--ext)}.c.t-j{--k:var(--jk)}.c.t-r{--k:var(--rg)}
.c .cr{position:absolute;top:5px;left:7px;font-size:13px;font-weight:700;color:var(--k);z-index:1}
.c b{font-size:38px;line-height:1;z-index:1;text-shadow:0 2px 6px #000}.c b.lg{font-size:19px}
.c i{position:absolute;left:0;right:0;bottom:0;text-align:center;font:700 9px/1.2 Georgia,serif;font-style:normal;letter-spacing:.5px;background:color-mix(in srgb,var(--k) 30%,#0b0610);padding:4px 2px;z-index:1}
.c.mini{width:56px;height:82px;flex:none;cursor:default}.c.mini:hover{transform:none}.c.mini b{font-size:24px}.c.mini b.lg{font-size:13px}.c.mini i{font-size:7px;padding:2px 1px}.c.mini .cr{font-size:9px;top:3px;left:4px}
.msg{padding:9px 12px;border-radius:10px;background:#120815;border:1px solid var(--bd);margin:8px 0;font-size:14px}
.win{color:var(--ext)}.lose{color:var(--rose)}.box.over{text-align:center;font-size:18px;font-weight:700}
.modal{position:fixed;inset:0;background:#000c;z-index:9;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 20px;display:flex;align-items:flex-start;justify-content:center}
.mbox{max-width:640px;width:100%;background:var(--panel);border:1px solid var(--gold);border-radius:16px;padding:16px;box-shadow:0 0 40px #000}
.mbox h2{font:700 18px var(--disp);color:var(--gold);margin:0 0 8px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.tabs button{padding:6px 11px;font-size:13px}.tabs button.on{background:var(--gold);color:#1b0e1f;border-color:var(--gold)}
.rr{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--bd);font-size:14.5px}.rr:first-of-type{border-top:0}
.mbox p{margin:8px 0;font-size:14.5px}.mbox li{margin:4px 0;font-size:14.5px}
@media(max-width:480px){.piles{gap:6px}.pile .n{font-size:36px}.c{width:74px;height:108px}.c b{font-size:34px}}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><symbol id="s" viewBox="0 0 64 64"><path d="M32 3C16.5 3 7 13.5 7 27c0 8.5 4 14.5 11 18.5V54c0 2.5 1.5 4.5 4.5 4.5h19c3 0 4.5-2 4.5-4.5v-8.5c7-4 11-10 11-18.5C57 13.5 47.5 3 32 3z"/><g style="fill:var(--bg)"><circle cx="21.5" cy="28" r="7.5"/><circle cx="42.5" cy="28" r="7.5"/><path d="M32 35.5l-4.5 9h9z"/><rect x="21" y="49" width="22" height="2.4" rx="1.2"/><path d="M26 51v6M32 51v6M38 51v6" style="stroke:var(--bg);stroke-width:2"/><circle cx="32" cy="12" r="2.4"/><circle cx="24" cy="15" r="1.6"/><circle cx="40" cy="15" r="1.6"/></g><circle cx="21.5" cy="28" r="2.6"/><circle cx="42.5" cy="28" r="2.6"/></symbol></svg>
<div id="app"></div><div id="rules"></div>
<script>

const FIRE=[22,33,44,55,66,77],$=s=>document.querySelector(s);
const CMD={stop:['⛔','STOP'],skull:['☠','COPRI'],three:['③','3!'],nocomm:['🤐','MUTI'],nojump:['🚫','NO ±10'],single:['☝','1 PILA'],draw1:['⬇','PESCA 1']};
const SK='<svg class="sk"><use href="#s"/></svg>';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let db=null,ref=null,unsub=null,S=null,sel=null,busy=false,err='';
let me;try{me=sessionStorage.gid||(sessionStorage.gid='p'+Math.random().toString(36).slice(2,9))}catch(e){me='p'+Math.random().toString(36).slice(2,9)}
let myName='';try{myName=localStorage.gname||''}catch(e){}
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const hs=n=>n===1?8:n===2?7:6,cur=()=>S.players[S.turn];
const active=x=>S.piles.some(p=>p.x===x);
const need=()=>S.three?3:(S.deck.length?2:1);
const allEmpty=()=>!S.deck.length&&S.players.every(x=>!S.hands[x.id].length);
const logm=t=>{S.log=[t,...(S.log||[])].slice(0,6)};
const lab=c=>c.j?'JOLLY':c.r!=null?c.r+'–'+(c.r+9):c.v;
const key=c=>c.j?1000:c.r!=null?c.r+.5:c.v;
function legal(pi,c){
 const p=S.piles[pi];
 if(S.three&&S.played>=3)return false;
 if(active('single')&&S.sp!=null&&S.sp!==pi)return false;
 if(c.x==='stop'&&S.three&&S.played!==2)return false;
 if(c.j)return p.m!=='jk';
 if(c.r!=null)return p.t>=c.r&&p.t<=c.r+9;
 const jp=!active('nojump');
 return p.u?(c.v>p.t||(jp&&c.v===p.t-10)):(c.v<p.t||(jp&&c.v===p.t+10))}
let ws=null;
const code0=()=>{try{return sessionStorage.gcode||''}catch(e){return ''}};
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(Object.assign({pid:me},o)))}
function conn(){
 ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
 ws.onopen=()=>{err='';if(code0())send({t:'join',code:code0(),name:myName||'Giocatore'});render()};
 ws.onmessage=e=>{const m=JSON.parse(e.data);
  if(m.t==='state'){S=m.s;try{sessionStorage.gcode=S.code}catch(x){}err='';render()}
  else if(m.t==='err'){err=m.m;if(m.m==='Partita non trovata.'){S=null;try{sessionStorage.gcode=''}catch(x){}}render()}};
 ws.onclose=()=>{err='Connessione persa, riconnessione…';render();setTimeout(conn,1500)}}
const optTxt=o=>[o.fire&&'🔥 On Fire',o.ext&&'⚡ Extreme',o.joker&&'🃏 Jolly',o.tens&&'🔟 Decine'].filter(Boolean).join(' · ')||'Partita base';
const BUNT=[...Array(40)].map((_,i)=>`<span style="border-top-color:${['var(--rose)','var(--gold)','var(--ame)','var(--ext)','var(--fire)','var(--jk)'][i%6]}"></span>`).join('');
const TYPE=c=>c.f?'t-f':c.x?'t-x':c.j?'t-j':c.r!=null?'t-r':'';
const tag=c=>c.f?'🔥 FUOCO':c.x?CMD[c.x][0]+' '+CMD[c.x][1]:c.j?'🃏 JOLLY':c.r!=null?'FASCIA':'🌹';
function card(c,i,o){const l=String(lab(c));return `<div class="c ${TYPE(c)} ${o||''}" ${i!=null?`data-c="${i}"`:''}><span class="cr">${c.j?'J':c.r!=null?c.r:c.v}</span><svg class="wm"><use href="#s"/></svg><b class="${l.length>2?'lg':''}">${l}</b><i>${tag(c)}</i></div>`}
function pileH(p,i,ok){
 const m=p.f?'<em class="mf">🔥 COPRI</em>':p.m==='sk'?'<em>☠ COPRI</em>':p.m==='jk'?'<em class="mj">🃏 COPRI</em>':p.x?`<em>${CMD[p.x][0]} ${CMD[p.x][1]}</em>`:'';
 return `<div class="pile ${p.u?'u':'d'} ${p.f?'fire':''} ${ok?'ok':''}" data-p="${i}"><div class="pt">${p.u?'▲ SALE':'▼ SCENDE'}</div><svg class="wm"><use href="#s"/></svg><div class="n">${p.t}</div><div class="pm">${m}</div></div>`}
function render(){
 const A=$('#app');
 let h=`<div class="top"><h1>The Game<small>Santa Muerte</small></h1><button class="sec" data-r="open">❓ Regole</button></div><div class="bunt">${BUNT}</div>`;
 if(!S){
  h+=`<div class="box"><div class="lbl">Il tuo nome</div><div class="row"><input id="nm" value="${esc(myName)}" placeholder="Nome" maxlength="14"></div>
  <div class="lbl">Nuova partita</div><div class="row"><select id="bots"><option value="0">Solo io</option><option value="1" selected>+1 computer</option><option value="2">+2 computer</option><option value="3">+3 computer</option><option value="4">+4 computer</option></select></div>
  <div class="lbl">Varianti ed espansioni</div>
  <div><label class="o"><input type="checkbox" id="o1" checked>🔥 On Fire</label><label class="o"><input type="checkbox" id="o2">⚡ Extreme</label><label class="o"><input type="checkbox" id="o3">🃏 Jolly</label><label class="o"><input type="checkbox" id="o4">🔟 Decine</label></div>
  <div class="row"><button data-a="new">Crea partita</button></div>
  <div class="lbl">Unisciti a un amico</div><div class="row"><input id="cd" placeholder="Codice" maxlength="4" style="text-transform:uppercase;width:130px"><button class="sec" data-a="join">Entra</button></div>
  ${err?'<div class="msg lose">'+esc(err)+'</div>':''}</div>`;
  A.innerHTML=h;return}
 const host=S.host===me,mine=S.hands&&S.hands[me];
 if(S.status==='lobby'){
  h+=`<div class="box"><div class="lbl">Codice partita</div><div style="font:700 38px var(--disp);letter-spacing:8px;color:var(--gold)">${S.code}</div><div class="msg">${optTxt(S.opt)}</div>
  <div class="lbl">Giocatori</div><div class="pl">${S.players.map(p=>`<div style="opacity:1">${p.bot?'🤖 ':''}${esc(p.name)}${p.id===S.host?' ★':''}</div>`).join('')}</div>
  <div class="row">${host?`<button data-a="start">Avvia (${S.players.length}/5)</button>`:'<span>In attesa dell\'host…</span>'}<button class="sec" data-a="leave">Esci</button></div>${err?'<div class="msg lose">'+esc(err)+'</div>':''}</div>`;
  A.innerHTML=h;return}
 const my=S.status==='play'&&cur().id===me,done=S.status!=='play';
 const acts=['nocomm','nojump','single','draw1'].filter(active);
 h+=`<div class="pl">${S.players.map((p,i)=>{const on=i===S.turn&&!done;return `<div class="${on?'t':''}">${on?'🕯️ ':''}${p.bot?'🤖 ':''}${esc(p.name)}${p.id===me?' (tu)':''} <small>· ${S.hands[p.id].length} carte</small></div>`}).join('')}<div style="opacity:1"><small>Mazzo: ${S.deck.length}</small></div></div>`;
 if(done)h+=`<div class="box over ${S.status==='won'?'win':'lose'}" style="margin-top:12px">${S.status==='won'?'🌹 Avete vinto! Tutte le carte sono state giocate.':'💀 Partita persa'}<div style="font-size:14px;font-weight:400;color:var(--fg)">${S.status==='won'?'':esc(S.msg)}</div><div class="row" style="justify-content:center"><button data-a="leave">Nuova partita</button></div></div>`;
 else if(my){const nd=need();h+=`<div class="turn me">🕯️ È IL TUO TURNO <span class="pips">${[...Array(nd)].map((_,i)=>`<span class="${i<S.played?'on':''}"></span>`).join('')}</span></div>
  <div class="hint">${S.three?'<b>3!</b> — esattamente 3 carte. ':''}${S.piles.some(p=>p.f===S.tn||p.m)?'<b>Hai una carta da coprire!</b> ':''}Seleziona una carta, poi tocca la pila.</div>`}
 else h+=`<div class="turn">⏳ Turno di <b>${esc(cur().name)}</b></div>`;
 if(acts.length)h+=`<div class="msg" style="border-color:var(--ext)">In vigore: ${acts.map(x=>CMD[x][0]+' '+CMD[x][1]).join(' · ')}${active('nocomm')?' — vietato comunicare!':''}</div>`;
 h+=`<div class="piles">${S.piles.map((p,i)=>pileH(p,i,my&&sel!=null&&mine[sel]&&legal(i,mine[sel]))).join('')}</div>`;
 if(mine){h+=`<div class="hand">${mine.map((c,i)=>[c,i]).sort((a,b)=>key(a[0])-key(b[0])).map(([c,i])=>card(c,i,sel===i?'sel':'')).join('')}</div>
 <div class="row" style="justify-content:center"><button data-a="end" ${my&&!done&&(S.played>=need()||S.stopped)?'':'disabled'}>Fine turno</button><button class="sec" data-a="leave">Esci</button></div>`}
 h+=err?'<div class="msg lose">'+esc(err)+'</div>':'';
 A.innerHTML=h}
let rulesOpen=false,rtab='base';
const rr=(c,x)=>`<div class="rr">${c}<div>${x}</div></div>`;
const mc=(o)=>card(o,null,'mini');
const RT={
base:()=>`<p><b>Obiettivo:</b> giocare tutte le carte, insieme, prima che qualcuno resti bloccato.</p>
<p>Ci sono 4 pile: due <b style="color:var(--rose)">▲ ascendenti</b> (partono da 1) e due <b style="color:var(--ame)">▼ discendenti</b> (partono da 100).</p>
<ul><li>Sulle ascendenti metti una carta <b>più alta</b> della cima, sulle discendenti una <b>più bassa</b>.</li>
<li><b>Trucco del 10:</b> puoi giocare una carta esattamente 10 più bassa (ascendente) o 10 più alta (discendente) della cima, per "tornare indietro".</li>
<li>Nel tuo turno devi giocare <b>almeno 2 carte</b> (1 sola quando il mazzo è finito), poi peschi fino ad avere 8 carte (1 giocatore), 7 (2) o 6 (3-5).</li>
<li>Se non puoi giocare il minimo di carte, <b>la partita è persa</b>.</li>
<li><b>Comunicazione:</b> puoi dare indizi vaghi ("non toccare quella pila", "ho una carta adatta"), ma <b>mai dire i numeri</b> che hai in mano.</li></ul>
<p>Il turno passa solo quando premi <b>Fine turno</b> (attivo dopo il minimo di carte). Le carte in mano sono visibili solo a te; le pile mostrano la cima.</p>`,
fire:()=>rr(mc({v:44,f:1}),'<b>Carta fuoco 🔥</b> — sono le carte 22, 33, 44, 55, 66 e 77. Quando ne giochi una su una pila, quella pila diventa "in fiamme": <b>deve essere coperta con un\'altra carta entro la fine del turno del giocatore successivo</b>, altrimenti la partita è persa. La pila è evidenziata finché non viene coperta.'),
ext:()=>`<p>28 carte numerate (assegnate a caso a ogni partita) portano un comando. Si applica quando la carta viene giocata.</p><div class="lbl">Immediati</div>`
+rr(mc({v:'?',x:'stop'}),'<b>⛔ STOP</b> — il tuo turno finisce subito, anche con meno carte del minimo. Se è attivo "3!" può essere solo la terza carta.')
+rr(mc({v:'?',x:'skull'}),'<b>☠ COPRI</b> — devi coprirlo con una carta giocabile <b>nello stesso turno</b>. Se resta scoperto a fine turno (anche l\'ultima carta del gioco) si perde.')
+rr(mc({v:'?',x:'three'}),'<b>③ 3!</b> — in questo turno devi giocare <b>esattamente 3 carte</b>.')
+`<div class="lbl">Continui (finché la carta è in cima a una pila)</div>`
+rr(mc({v:'?',x:'nocomm'}),'<b>🤐 MUTI</b> — nessuna comunicazione, nemmeno indizi.')
+rr(mc({v:'?',x:'nojump'}),'<b>🚫 NO ±10</b> — il trucco del 10 è vietato.')
+rr(mc({v:'?',x:'single'}),'<b>☝ 1 PILA</b> — tutte le carte del turno vanno sulla stessa pila.')
+rr(mc({v:'?',x:'draw1'}),'<b>⬇ PESCA 1</b> — a fine turno si pesca una sola carta.'),
joker:()=>rr(mc({j:1}),'<b>🃏 Jolly</b> — 10 carte in più nel mazzo. Si può giocare su <b>qualsiasi pila</b>. Poi va coperto <b>nello stesso turno</b> con una carta valida rispetto alla carta che c\'era <i>sotto</i> il jolly (trucco del 10 compreso), altrimenti si perde. Il jolly copre anche una carta fuoco.'),
tens:()=>rr(mc({r:20}),'<b>🔟 Fascia</b> — 9 carte in più (10–19, 20–29 … 90–99). Si gioca su una pila solo se la sua cima è <b>dentro la fascia</b>. Su una ascendente la pila riparte dall\'<b>inizio</b> della fascia (cima 29 + "20–29" → 20); su una discendente dalla <b>fine</b> (cima 41 + "40–49" → 49).')};
function rulesRender(){
 const R=$('#rules');if(!rulesOpen){R.innerHTML='';return}
 const T=[['base','Base'],['fire','🔥 On Fire'],['ext','⚡ Extreme'],['joker','🃏 Jolly'],['tens','🔟 Decine']];
 const on=S&&S.opt?{fire:S.opt.fire,ext:S.opt.ext,joker:S.opt.joker,tens:S.opt.tens}:{};
 R.innerHTML=`<div class="modal"><div class="mbox"><div class="top"><h2>Come si gioca</h2><button class="sec" data-r="close">✕ Chiudi</button></div>
 <div class="tabs">${T.map(([k,n])=>`<button class="${rtab===k?'on':'sec'}" data-r="${k}">${n}${on[k]?' ✓':''}</button>`).join('')}</div>${RT[rtab]()}</div></div>`}
document.addEventListener('click',e=>{
 if(e.target.classList&&e.target.classList.contains('modal')){rulesOpen=false;return rulesRender()}
 const t=e.target.closest('[data-r]');if(!t)return;const r=t.dataset.r;
 if(r==='open'){rulesOpen=true;rtab='base'}else if(r==='close')rulesOpen=false;else rtab=r;
 rulesRender()});
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-a],[data-c],[data-p]');if(!t)return;const a=t.dataset.a;
 if(a==='new'||a==='join'){
  myName=($('#nm').value.trim()||'Giocatore');try{localStorage.gname=myName}catch(x){}
  if(a==='new')send({t:'create',name:myName,bots:+$('#bots').value,opt:{fire:$('#o1').checked,ext:$('#o2').checked,joker:$('#o3').checked,tens:$('#o4').checked}});
  else send({t:'join',code:$('#cd').value.trim().toUpperCase(),name:myName});
  return}
 if(a==='start')return send({t:'start'});
 if(a==='leave'){send({t:'leave'});S=null;sel=null;err='';try{sessionStorage.gcode=''}catch(x){}return render()}
 if(!S||S.status!=='play'||cur().id!==me)return;
 if(a==='end'&&(S.played>=need()||S.stopped)){sel=null;return send({t:'end'})}
 if(t.dataset.c!=null){const i=+t.dataset.c;sel=sel===i?null:i;return render()}
 if(t.dataset.p!=null&&sel!=null){const i=+t.dataset.p;if(!legal(i,S.hands[me][sel]))return;const k=sel;sel=null;send({t:'play',i:k,pi:i})}
});
conn();render();
</script></body></html>
